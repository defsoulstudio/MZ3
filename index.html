    function formatCompactBRL(val) {

      }
      if (val >= 1000) {

    function kpiCardHtml(title, value, subtitle, accent, clickTab) {

        : 'bg-white border-slate-200 text-[#0B3B44] shadow-sm';

          ? 'border-teal-500 shadow-[0_0_15px_rgba(20,184,166,0.15)]'
          : 'border-[#00897B] ring-1 ring-[#00897B]/20'
        : '';
      const clickAttr = clickTab ? `data-action="switch-tab" data-tab="${escapeHtml(clickTab)}"` : '';
      const cursorCls = clickTab ? 'cursor-pointer hover:scale-[1.01]' : '';
      const valColor = isDark ? (accent ? 'text-teal-400' : 'text-white') : 'text-[#0B3B44]';
      const subBorder = isDark ? 'border-slate-700 text-slate-400' : 'border-slate-100 text-[#0B3B44]/80';

      return `
        <div ${clickAttr} class="${cardBg} ${accentCls} ${cursorCls} rounded-xl border p-4 transition-all flex flex-col justify-between">
          <div class="flex items-center justify-between gap-2">

    function renderAcordosHtml() {
      const isDark = state.theme === 'dark';
      const cardBg = isDark ? 'bg-slate-800 border-slate-700 text-slate-100' : 'bg-white border-slate-200 text-[#0B3B44] shadow-sm';
      const subText = isDark ? 'text-slate-400' : 'text-slate-500';
      const q = state.searchQuery.trim().toLowerCase();

      const isEmCursoOut26 = (meses) => {
        const m = String(meses || '').toLowerCase();
        return m.includes('outubro') || m.includes('novembro') || m.includes('/27');
      };

      const acordosRows = FULL_DATA.acordos.filter((a) => {
        if (state.filtroAcordos === 'vigentes' && a.fase === 'Arquivado') return false;
        if (state.filtroAcordos === 'em_curso' && (a.fase === 'Arquivado' || !isEmCursoOut26(a.meses))) return false;
        if (state.filtroAcordos === 'arquivados' && a.fase !== 'Arquivado') return false;
        if (q) {
          return (
            a.processo.toLowerCase().includes(q) ||
            a.autor.toLowerCase().includes(q) ||
            a.fase.toLowerCase().includes(q) ||
            a.meses.toLowerCase().includes(q)
          );
        }
        return true;
      });

      const totalParcelasCount = acordosRows.reduce((s, a) => s + a.parcelas, 0);
      const totalAcordosVal = acordosRows.reduce((s, a) => s + a.valorAcordo, 0);
      const totalParcelasVal = acordosRows.reduce((s, a) => s + a.valorParcela, 0);
      const totalPericiaisCount = acordosRows.filter((a) => a.obs && a.obs.trim() !== '').length;

      return `
        <div class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

            ${kpiCardHtml('Honorários / Encargos', totalPericiaisCount > 0 ? totalPericiaisCount + ' proc.' : '--', 'Processos c/ honorários periciais', false)}
            ${kpiCardHtml('Acordos Vigentes', String(acordosRows.length), totalParcelasCount + ' parcelas monitoradas no filtro', false)}
          </div>

          <div class="${cardBg} rounded-xl border overflow-hidden">
            <div class="p-3.5 border-b border-slate-200/50 flex flex-wrap items-center justify-between gap-3">
              <div>
                <span class="text-xs font-bold">
                  Exibindo: ${state.filtroAcordos === 'vigentes' ? 'Somente Acordos Vigentes (Processos Ativos)' : state.filtroAcordos === 'em_curso' ? 'Acordos com Parcelas Vencendo (Out/26 a 2027)' : state.filtroAcordos === 'arquivados' ? 'Acordos Já Arquivados / Quitados' : 'Todos os Acordos (Vigentes + Arquivados)'}
                </span>
                <p class="text-[11px] ${subText}">Os processos já arquivados foram ocultados por padrão para focar apenas nos acordos vigentes.</p>
              </div>
              <div class="flex flex-wrap items-center gap-1.5">
                ${[
                  { id: 'vigentes', label: 'Somente Vigentes (17)' },
                  { id: 'em_curso', label: 'Parcelas Out/26–2027 (13)' },
                  { id: 'arquivados', label: 'Arquivados (4)' },
                  { id: 'todos', label: 'Todos (21)' }
                ].map((btn) => `
                  <button data-action="filter-acordos" data-filtro="${btn.id}" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${state.filtroAcordos === btn.id ? 'bg-[#00897B] text-white' : (isDark ? 'bg-slate-700 text-slate-300' : 'bg-slate-100 text-slate-700')}">
                    ${btn.label}
                  </button>
                `).join('')}
              </div>

            <div class="overflow-x-auto max-h-[540px] custom-scroll">

      else if (state.activeTab === 'Processos') tabContentHtml = renderProcessosHtml(filteredProcs);
      else if (state.activeTab === 'Cível') tabContentHtml = renderCivelHtml(filteredProcs);
      else if (state.activeTab === 'Trabalhista') tabContentHtml = renderTrabalhistaHtml(filteredProcs);
      else if (state.activeTab === 'Audiências') tabContentHtml = renderAudienciasHtml();
      else if (state.activeTab === 'Prazos') tabContentHtml = renderPrazosHtml(filteredProcs);
      else if (state.activeTab === 'Relatórios') tabContentHtml = renderRelatoriosHtml();
      else if (state.activeTab === 'Indicadores') tabContentHtml = renderIndicadoresHtml();
      else if (state.activeTab === 'Provisionamento') tabContentHtml = renderProvisionamentoHtml(filteredProcs);
      else if (state.activeTab === 'Acordos') tabContentHtml = renderAcordosHtml();
      else if (state.activeTab === 'Configurações') tabContentHtml = renderConfiguracoesHtml();

      root.innerHTML = `
        <div class="flex h-screen w-screen overflow-hidden ${isDark ? 'bg-slate-900 text-slate-100' : 'bg-[#F4F7F6] text-[#0B3B44]'}">
          <!-- SIDEBAR -->
          <aside class="${state.isSidebarOpen ? 'w-56' : 'w-16'} flex-shrink-0 bg-[#003D33] border-r border-[#002B24] transition-all duration-300 flex flex-col z-20 select-none">
            <div class="p-3 flex items-center justify-between border-b border-teal-800/60">
              ${state.isSidebarOpen ? `
                <div class="flex items-center gap-2.5 overflow-hidden">
                  <img src="${MZ3_LOGO_SRC}" alt="MZ3 Engenharia" class="w-10 h-10 object-contain rounded bg-white/10 p-1 flex-shrink-0" />
                  <div class="leading-tight">
                    <div class="font-extrabold text-white text-sm tracking-wide">MZ3 ENGENHARIA</div>
                    <div class="text-[10px] text-teal-200 font-medium">Dashboard Jurídico</div>
                  </div>
                </div>
              ` : `
                <img src="${MZ3_LOGO_SRC}" alt="MZ3" class="w-9 h-9 object-contain mx-auto rounded bg-white/10 p-1" />
              `}
              <button data-action="toggle-sidebar" class="p-1.5 rounded-lg hover:bg-teal-800/50 text-teal-200 transition-colors" title="Alternar menu">☰</button>
            </div>

            <nav class="flex-1 overflow-y-auto py-2.5 px-2.5 space-y-1.5 custom-scroll">
              ${MENU_ITEMS.map((item) => {
                const isActive = state.activeTab === item.name;
                return `
                  <button data-action="switch-tab" data-tab="${escapeHtml(item.name)}" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-semibold transition-all border ${isActive ? 'bg-[#00897B] text-white border-teal-300/60 shadow-md' : 'bg-[#004D40]/80 text-teal-100/90 border-teal-700/60 hover:bg-[#00695C] hover:text-white'}">
                    <span>${item.icon}</span>
                    ${state.isSidebarOpen ? `<span class="truncate flex-1 text-left">${escapeHtml(item.name)}</span>` : ''}
                  </button>
                `;
              }).join('')}
            </nav>
          </aside>

          <!-- MAIN AREA -->
          <div class="flex-1 flex flex-col h-screen overflow-hidden">
            <header class="px-5 py-3 border-b flex flex-wrap items-center justify-between gap-3 z-10 ${isDark ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}">
              <div>
                <h1 class="text-lg md:text-2xl font-normal tracking-tight">
                  <span class="font-extrabold text-[#475569]">MZ</span><span class="font-extrabold text-[#00897B]">3</span>
                  <span class="font-semibold"> ENGENHARIA | Dashboard Jurídico</span>
                </h1>
                <p class="text-xs font-medium ${isDark ? 'text-slate-400' : 'text-slate-500'}">${escapeHtml(currentMenu.subtitle)}</p>
              </div>

              <div class="flex flex-wrap items-center gap-2.5">
                <div class="relative">
                  <input id="global-search-input" type="text" value="${escapeHtml(state.searchQuery)}" placeholder="Buscar processo, autor, objeto..." class="text-xs rounded-lg pl-3 pr-7 py-1.5 border w-48 md:w-60 focus:outline-none focus:ring-2 focus:ring-[#00897B] ${isDark ? 'bg-slate-800 border-slate-700 text-slate-100' : 'bg-[#F8FAFC] border-slate-300 text-slate-800'}" />
                  ${state.searchQuery ? `<button data-action="clear-search" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs">✕</button>` : ''}
                </div>

                <!-- Botão de Aprovar ou Revogar Acessos via E-mail -->
                <button data-action="open-access-modal" class="px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 border transition-colors ${isDark ? 'bg-slate-800 border-teal-500/40 text-teal-300 hover:bg-slate-700' : 'bg-teal-50 border-[#00897B]/40 text-[#004D40] hover:bg-teal-100'}">
                  <span>✉️ Acessos E-mail</span>
                  ${pendingCount > 0 ? `<span class="px-1.5 py-0.2 rounded-full bg-amber-500 text-white text-[10px] font-extrabold">${pendingCount}</span>` : ''}
                </button>

                <button data-action="toggle-presentation" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition-colors ${state.isPresentationMode ? 'bg-[#00897B] text-white border-[#00897B]' : (isDark ? 'bg-slate-800 border-slate-700 text-teal-400' : 'bg-[#F4F7F6] border-slate-300 text-[#0B3B44]')}">
                  ${state.isPresentationMode ? 'Sair Modo Reunião' : 'Modo Reunião'}
                </button>

                <button data-action="toggle-theme" class="px-2.5 py-1.5 rounded-lg border text-xs ${isDark ? 'bg-slate-800 border-slate-700 text-amber-400' : 'bg-[#F8FAFC] border-slate-300 text-slate-700'}" title="Alternar tema Claro/Escuro">
                  ${isDark ? '☀️' : '🌙'}
                </button>

                <div class="px-3 py-1.5 rounded-lg border text-[11px] font-semibold hidden xl:block ${isDark ? 'bg-slate-800 border-slate-700 text-slate-300' : 'bg-[#F8FAFC] border-slate-200 text-[#0B3B44]'}">
                  Última atualização: 15/10/2026 22:00
                </div>
              </div>
            </header>

            ${state.isPresentationMode ? `
              <div class="bg-[#004D40] text-white px-5 py-2 flex items-center justify-between text-xs shadow-md">
                <button data-action="prev-tab" ${currentTabIndex <= 0 ? 'disabled' : ''} class="px-2.5 py-1 rounded bg-white/10 hover:bg-white/20 disabled:opacity-40 font-semibold">◀ Anterior</button>
                <div class="flex items-center gap-1.5 overflow-x-auto py-0.5">
                  ${MENU_ITEMS.map((m, i) => `
                    <button data-action="switch-tab" data-tab="${escapeHtml(m.name)}" class="px-2 py-0.5 rounded text-[11px] font-semibold whitespace-nowrap ${state.activeTab === m.name ? 'bg-[#00897B] text-white' : 'text-teal-200 hover:bg-white/10'}">${i + 1}. ${escapeHtml(m.name)}</button>
                  `).join('')}
                </div>
                <button data-action="next-tab" ${currentTabIndex >= MENU_ITEMS.length - 1 ? 'disabled' : ''} class="px-2.5 py-1 rounded bg-white/10 hover:bg-white/20 disabled:opacity-40 font-semibold">Próxima ▶</button>
              </div>
            ` : ''}

            <main class="flex-1 overflow-y-auto p-4 md:p-5 custom-scroll">
              ${tabContentHtml}
            </main>
          </div>

          ${renderAccessModalHtml()}
          ${renderProcessoModalHtml()}

          ${state.toastMessage ? `
            <div class="fixed bottom-4 right-4 z-[100] bg-[#004D40] text-white px-4 py-2.5 rounded-xl shadow-lg border border-teal-400/40 text-xs font-semibold">
              ✓ ${escapeHtml(state.toastMessage)}
            </div>
          ` : ''}
        </div>
      `;

      initActiveTabCharts();
    }

    // Event delegation for all buttons, rows, and inputs
    document.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.getAttribute('data-action');

      if (action === 'switch-tab') {
        state.activeTab = target.getAttribute('data-tab') || 'Visão Geral';
        renderApp();
      } else if (action === 'toggle-sidebar') {
        state.isSidebarOpen = !state.isSidebarOpen;
        renderApp();
      } else if (action === 'toggle-theme') {
        state.theme = state.theme === 'dark' ? 'pbi' : 'dark';
        renderApp();
      } else if (action === 'toggle-presentation') {
        state.isPresentationMode = !state.isPresentationMode;
        state.isSidebarOpen = !state.isPresentationMode;
        renderApp();
      } else if (action === 'prev-tab') {
        const idx = MENU_ITEMS.findIndex((m) => m.name === state.activeTab);
        if (idx > 0) { state.activeTab = MENU_ITEMS[idx - 1].name; renderApp(); }
      } else if (action === 'next-tab') {
        const idx = MENU_ITEMS.findIndex((m) => m.name === state.activeTab);
        if (idx < MENU_ITEMS.length - 1) { state.activeTab = MENU_ITEMS[idx + 1].name; renderApp(); }
      } else if (action === 'clear-search') {
        state.searchQuery = '';
        renderApp();
      } else if (action === 'filter-acordos') {
        state.filtroAcordos = target.getAttribute('data-filtro') || 'vigentes';
        renderApp();
      } else if (action === 'filter-aud') {
        state.selectedTipoAud = target.getAttribute('data-tipo') || 'Todos';
        renderApp();
      } else if (action === 'open-proc') {
        state.selectedProcessoId = Number(target.getAttribute('data-id'));
        renderApp();
      } else if (action === 'open-proc-by-num') {
        const num = target.getAttribute('data-proc');
        const found = FULL_DATA.processos.find((p) => p.processo === num);
        if (found) { state.selectedProcessoId = found.id; renderApp(); }
      } else if (action === 'close-proc-modal') {
        state.selectedProcessoId = null;
        renderApp();
      } else if (action === 'backdrop-close-proc') {
        if (e.target === target) {
          state.selectedProcessoId = null;
          renderApp();
        }
      } else if (action === 'open-access-modal') {
        state.isAccessModalOpen = true;
        renderApp();
      } else if (action === 'close-access-modal') {
        state.isAccessModalOpen = false;
        renderApp();
      } else if (action === 'backdrop-close-access') {
        if (e.target === target) {
          state.isAccessModalOpen = false;
          renderApp();
        }
      } else if (action === 'lock-screen') {
        state.isAccessModalOpen = false;
        state.loginError = '';
        state.isLocked = true;
        renderApp();
      } else if (action === 'login-mode') {
        state.loginMode = target.getAttribute('data-mode') || 'login';
        state.loginError = '';
        renderApp();
      } else if (action === 'unlock-gate') {
        const emailEl = document.getElementById('gate-email-input');
        const em = (emailEl ? emailEl.value : state.loginEmailInput).trim().toLowerCase();
        state.loginEmailInput = em;
        const userEntry = state.accessUsers.find((u) => u.email.toLowerCase() === em);
        if (!userEntry) {
          state.loginError = 'Este e-mail não está autorizado. Solicite aprovação na aba ao lado.';
          renderApp();
          return;
        }
        if (userEntry.status !== 'Aprovado') {
          state.loginError = 'Seu acesso está Pendente de aprovação pelo administrador.';
          renderApp();
          return;
        }
        state.isLocked = false;
        state.loginError = '';
        showToast('Acesso liberado para ' + em);
      } else if (action === 'submit-access-request') {
        const nmEl = document.getElementById('req-name-input');
        const emEl = document.getElementById('req-email-input');
        const nm = (nmEl ? nmEl.value : '').trim();
        const em = (emEl ? emEl.value : '').trim().toLowerCase();
        if (!nm || !em.includes('@')) {
          state.loginError = 'Informe seu nome e um e-mail válido.';
          renderApp();
          return;
        }
        state.accessUsers.push({ nome: nm, email: em, perfil: 'Visualizador', status: 'Pendente' });
        saveAccessUsers();
        state.requestNameInput = '';
        state.requestEmailInput = '';
        state.loginMode = 'login';
        state.loginEmailInput = em;
        state.loginError = 'Solicitação registrada! O administrador já pode aprovar seu e-mail.';
        renderApp();
      } else if (action === 'approve-user') {
        const idx = Number(target.getAttribute('data-idx'));
        if (state.accessUsers[idx]) {
          state.accessUsers[idx].status = 'Aprovado';
          saveAccessUsers();
          showToast('Acesso aprovado para ' + state.accessUsers[idx].email);
        }
      } else if (action === 'revoke-user') {
        const idx = Number(target.getAttribute('data-idx'));
        if (state.accessUsers[idx]) {
          state.accessUsers[idx].status = 'Pendente';
          saveAccessUsers();
          showToast('Acesso revogado para ' + state.accessUsers[idx].email);
        }
      } else if (action === 'remove-user') {
        const idx = Number(target.getAttribute('data-idx'));
        if (state.accessUsers[idx]) {
          const removed = state.accessUsers.splice(idx, 1);
          saveAccessUsers();
          showToast('Removido: ' + (removed[0] ? removed[0].email : ''));
        }
      } else if (action === 'add-approved-email' || action === 'add-approved-email-modal') {
        const isModal = action === 'add-approved-email-modal';
        const nmEl = document.getElementById(isModal ? 'modal-new-name' : 'cfg-new-name');
        const emEl = document.getElementById(isModal ? 'modal-new-email' : 'cfg-new-email');
        let nm = (nmEl ? nmEl.value : state.newAllowedName).trim();
        let em = (emEl ? emEl.value : state.newAllowedEmail).trim().toLowerCase();
        if (!em && nm.includes('@')) {
          em = nm.toLowerCase();
          nm = em.split('@')[0];
        }
        if (!em) {
          if (nm) {
            const slug = nm.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '.').replace(/^\.|\.$/g, '');
            em = slug + '@mz3engenharia.com.br';
          } else {
            showToast('Preencha o e-mail (ou nome) antes de clicar em + Aprovar E-mail.');
            if (emEl) emEl.focus();
            return;
          }
        } else if (!em.includes('@')) {
          em = em + '@mz3engenharia.com.br';
        }
        state.accessUsers.unshift({
          nome: nm || em.split('@')[0],
          email: em,
          perfil: 'Visualizador',
          status: 'Aprovado'
        });
        state.newAllowedName = '';
        state.newAllowedEmail = '';
        saveAccessUsers();
        showToast('Acesso adicionado e aprovado: ' + em);
      } else if (action === 'download-index-html') {
        try {
          let rawHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
          const usersJson = JSON.stringify(state.accessUsers);
          rawHtml = rawHtml.replace(/isLocked:\s*(true|false),/, 'isLocked: true,').replace(/accessUsers:\s*\[[\s\S]*?\]\s*\};/, 'accessUsers: ' + usersJson + '\n    };');
          const blob = new Blob([rawHtml], { type: 'text/html;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('Arquivo index.html baixado com os e-mails aprovados gravados no código!');
        } catch (err) {
          showToast('Erro ao gerar index.html');
        }
      } else if (action === 'export-csv') {
        const rows = getFilteredProcessos();
        const csv = [
          'Processo;Autor;Area;Fase;Valor;Exposicao;Risco',
          ...rows.map((r) => `"${r.processo}";"${r.autor}";"${r.area}";"${r.fase}";${r.valorNum};${r.exposicaoNum};"${r.risco}"`)
        ].join('\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'relatorio_juridico_mz3.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Relatório CSV exportado (' + rows.length + ' processos).');
      }
    });

    document.addEventListener('input', (e) => {
      if (!e.target) return;
      if (e.target.id === 'modal-new-name' || e.target.id === 'cfg-new-name') {
        state.newAllowedName = e.target.value;
        return;
      }
      if (e.target.id === 'modal-new-email' || e.target.id === 'cfg-new-email') {
        state.newAllowedEmail = e.target.value;
        return;
      }
      if (e.target.id === 'gate-email-input') {
        state.loginEmailInput = e.target.value;
        return;
      }
      if (e.target.id === 'req-name-input') {
        state.requestNameInput = e.target.value;
        return;
      }
      if (e.target.id === 'req-email-input') {
        state.requestEmailInput = e.target.value;
        return;
      }
      if (e.target.id === 'global-search-input') {
        const val = e.target.value;
        const pos = e.target.selectionStart;
        state.searchQuery = val;
        renderApp();
        const nextInput = document.getElementById('global-search-input');
        if (nextInput) {
          nextInput.focus();
          try { nextInput.setSelectionRange(pos, pos); } catch (err) {}
        }
      }
    });

    document.addEventListener('change', (e) => {
      if (!e.target) return;
      if (e.target.id === 'filter-fase-select') {
        state.selectedFaseFilter = e.target.value;
        renderApp();
      } else if (e.target.id === 'filter-risco-select') {
        state.selectedRiscoFilter = e.target.value;
        renderApp();
      } else if (e.target.id === 'trab-status-select') {
        state.selectedStatusTrab = e.target.value;
        renderApp();
      } else if (e.target.id === 'trab-funcao-select') {
        state.selectedFuncaoTrab = e.target.value;
        renderApp();
      }
    });

    window.onload = () => {
      renderApp();
    };
  </script>
</body>
</html>
